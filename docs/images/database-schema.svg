<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1016" width="1200" height="1016" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" role="img" aria-label="Column headers with types for the six database tables, grouped by role: ingest state, raw facts, aggregates and lookups.">
<style>.ti{font-size:28px;font-weight:700;fill:#111}.su{font-size:15px;fill:#777}.gl{font-size:16px;font-weight:700}.tn{font-size:15px;font-weight:700;fill:#111}.nl{font-size:13.5px;fill:#222}.pk{font-weight:700}.ty{font-size:11px;fill:#666}.lb{font-size:13px;fill:#444}</style>
<rect width="1200" height="1016" fill="#fff"/><text x="56" y="42" class="ti">LoL Draft Tool: database schema</text><text x="56" y="66" class="su">Six Postgres tables on Neon. Champions are stored as Data Dragon champ_ids; only the champions table maps an id to a name and icon.</text><rect x="56" y="100" width="1088" height="44" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.5"/><text x="72" y="127" class="tn">Legend</text>
