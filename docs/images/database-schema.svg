a5fd0" stroke-width="1.5"/><text x="766.5" y="486" class="nl" text-anchor="middle">redside_bottom_champ_id</text><text x="766.5" y="502" class="ty" text-anchor="middle">INTEGER</text><rect x="869" y="466" width="213" height="46" fill="#fff" stroke="#1a5fd0" stroke-width="1.5"/><text x="975.5" y="486" class="nl" text-anchor="middle">redside_support_champ_id</text><text x="975.5" y="502" class="ty" text-anchor="middle">INTEGER</text><rect x="56" y="544" width="1088" height="208" rx="8" fill="#fef3ea" stroke="#e0680f" stroke-width="1.5"/><text x="72" y="570" class="gl" fill="#e0680f">Aggregates: win counts the recommender reads</text><text x="72" y="602" class="tn">champion_role_stats</text><rect x="72" y="610" width="90" height="46" fill="#fbd9bf" stroke="#e0680f" stroke-width="1.5"/><text x="117" y="630" class="nl pk" text-anchor="middle">champ_id</text><text x="117" y="646" class="ty" text-anchor="middle">INTEGER</text><rect x="162" y="610" width="59" height="46" fill="#fbd9bf" stroke="#e0680f" stroke-width="1.5"/><text x="191.5" y="630" class="nl pk" text-anchor="middle">role</text><text x="191.5" y="646" class="ty" text-anchor="middle">TEXT</text><rect x="221" y="610" width="137" height="46" fill="#fff" stroke="#e0680f" stroke-width="1.5"/><text x="289.5" y="630" class="nl" text-anchor="middle">wins</text><text x="289.5" y="646" class="ty" text-anchor="middle">INTEGER DEFAULT 0</text><rect x="358" y="610" width="137" height="46" fill="#fff" stroke="#e0680f" stroke-width="1.5"/><text x="426.5" y="630" class="nl" text-anchor="middle">games</text><text x="426.5" y="646" class="ty" text-anchor="middle">INTEGER DEFAULT 0</text><text x="72" y="686" class="tn">champion_relationships</text><rect x="72" y="694" width="90" height="46" fill="#fbd9bf" stroke="#e0680f" stroke-width="1.5"/><text x="117" y="714" class="nl pk" text-anchor="middle">champ_id</text><text x="117" y="730" class="ty" text-anchor="middle">INTEGER</text><rect x="162" y="694" width="136" height="46" fill=