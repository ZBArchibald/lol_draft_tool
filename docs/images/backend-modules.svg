<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1877 1296" width="1877" height="1296" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker><marker id="ah-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#888"/></marker></defs><rect width="1877" height="1296" fill="#ffffff"/><text x="16" y="48" font-size="28" font-weight="bold" fill="#111" text-anchor="start">backend/: module map</text><text x="16" y="73" font-size="17" font-weight="normal" fill="#666" text-anchor="start">Left: request path, served on Cloud Run. Right: batch pipeline, run by GitHub Actions. Arrows point from importer/caller to callee.</text><rect x="141" y="99" width="560" height="84" rx="10" fill="#f1ecfb" stroke="#6b3fc0" stroke-width="1.5"/><text x="421.0" y="138.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">main.py</text><text x="421.0" y="158.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">FastAPI app, CORS middleware, mounts both routers</text><rect x="1107" y="99" width="560" height="84" rx="10" fill="#f1ecfb" stroke="#6b3fc0" stroke-width="1.5"/><text x="1387.0" y="138.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">cli.py (the ldt command)</text><text x="1387.0" y="158.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">setup_logging(), then match on the subcommand</text><path d="M420,183 L420,251" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="434" y="221" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">include_router</text><path d="M1387,183 L1387,251" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1400" y="221" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">dispatch subcommand</text><rect x="85" y="253" width="672" height="210" rx="10" fill="#edf3fd" stroke="#1a5fd0" stroke-width="1.5"/><text x="101" y="284" font-size="18" font-weight="bold" fill="#1a5fd0" text-anchor="start">api/</text><rect x="113" y="302" width="280" height="140" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="253.0" y="351.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">routes.py</text><text x="253.0" y="371.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">GET /api/champions</text><text x="253.0" y="389.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">POST /api/recommend</text><text x="253.0" y="407.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">500 if scoring raises</text><rect x="477" y="302" width="252" height="140" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="603.0" y="351.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">schemas.py</text><text x="603.0" y="371.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">Pydantic models</text><text x="603.0" y="389.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">DraftStateRequest,</text><text x="603.0" y="407.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">RecommendationResponse, …</text><path d="M393,350 L475,350" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="925" y="253" width="924" height="210" rx="10" fill="#fff3ea" stroke="#e06a10" stroke-width="1.5"/><text x="941" y="284" font-size="18" font-weight="bold" fill="#e06a10" text-anchor="start">pipeline/</text><rect x="953" y="302" width="224" height="140" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="1065.0" y="351.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">update_ladder.py</text><text x="1065.0" y="371.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">update-ladder: replace</text><text x="1065.0" y="389.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">Challenger + Grandmaster</text><text x="1065.0" y="407.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">player list</text><rect x="1205" y="302" width="336" height="140" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="1373.0" y="351.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">ingest_and_process_matches.py</text><text x="1373.0" y="371.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">run-match-sync: per player,</text><text x="1373.0" y="389.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">fetch → aggregate → flush</text><text x="1373.0" y="407.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">in one transaction</text><rect x="1569" y="302" width="252" height="140" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="1695.0" y="351.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">patch_maintenance.py</text><text x="1695.0" y="371.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">daily-maintenance:</text><text x="1695.0" y="389.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">wipe data on new patch,</text><text x="1695.0" y="407.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">refresh champions</text><path d="M393,413 L434,413 L434,595 L489,595" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M182,442 L182,559" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="196" y="505" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">recommend_champions()</text><path d="M602,442 L602,559" fill="none" stroke=