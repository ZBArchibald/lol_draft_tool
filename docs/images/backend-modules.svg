 fill="#222" text-anchor="middle">every read, upsert and delete</text><rect x="645" y="848" width="560" height="91" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="925.0" y="890.5" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">schema.py</text><text x="925.0" y="910.5" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">initialize_database(): CREATE TABLE IF NOT EXISTS × 6</text><rect x="113" y="974" width="1092" height="70" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="659.0" y="1006.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">connection.py</text><text x="659.0" y="1026.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">db_connection(): pooled psycopg connection (1–4), commit on success, rollback on error</text><path d="M364,939 L364,972" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M924,939 L924,972" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M113,406 L49,406 L49,891 L111,891" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="35" y="650" font-size="14.5" font-weight="normal" fill="#444" text-anchor="middle" transform="rotate(-90 35 650)">champion_dictionary_from_db()</text><path d="M238,715 L238,847" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="252" y="785" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">candidates, win rates, relationships</text><path d="M1107,140 L868,140 L868,846" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="813" y="237" font-size="14.5" font-weight="normal" fill="#444" text-anchor="middle">init-db</text><path d="M1064,463 L1064,797" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1078" y="624" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">queries.py (all three)</text><text x="1078" y="644" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">db_connection() (ingest, patch)</text><path d="M1610,463 L1610,559" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1624" y="515" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">all three</text><rect x="1373" y="561" width="476" height="154" rx="10" fill="#f6eeec" stroke="#7a4a3a" stroke-width="1.5"/><text x="1611.0" y="608.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">external/riot_api.py</text><text x="1611.0" y="628.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">Riot API calls: limiter (20 req/s, 100 req/120 s),</text><text x="1611.0" y="646.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">429 → Retry-After or backoff, up to 3 tries</text><text x="1611.0" y="664.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">Data Dragon calls: plain requests,</text><text x="1611.0" y="682.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">no key and no limiter</text><path d="M1484,715 L1484,825" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1498" y="773" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">HTTPS</text><path d="M1736,715 L1736,825" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1750" y="773" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">HTTPS</text><rect x="1373" y="827" width="224" height="112" rx="10" fill="#fdeaea" stroke="#d02020" stroke-width="1.5"/><text x="1485.0" y="871.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Riot API</text><text x="1485.0" y="891.0" font-size="15" font-weight="normal" fill="#222" 