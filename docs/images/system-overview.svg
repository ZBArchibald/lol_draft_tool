<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1889 1389" width="1889" height="1389" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker><marker id="ah-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#888"/></marker></defs><rect width="1889" height="1389" fill="#ffffff"/><text x="56" y="48" font-size="28" font-weight="bold" fill="#111" text-anchor="start">LoL Draft Tool: system overview</text><text x="56" y="73" font-size="17" font-weight="normal" fill="#666" text-anchor="start">Where each piece runs and what talks to what</text><rect x="530" y="79" width="784" height="196" rx="10" fill="#fff3ea" stroke="#e06a10" stroke-width="1.5"/><text x="546" y="110" font-size="18" font-weight="bold" fill="#e06a10" text-anchor="start">Cloudflare Pages</text><rect x="558" y="128" width="308" height="119" rx="10" fill="#ffffff" stroke="#e06a10" stroke-width="1.5"/><text x="712.0" y="175.5" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Pages build</text><text x="712.0" y="195.5" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">npm run build in client/</text><text x="712.0" y="213.5" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">(tsc + vite build → dist/)</text><rect x="950" y="128" width="336" height="119" rx="10" fill="#ffffff" stroke="#e06a10" stroke-width="1.5"/><text x="1118.0" y="166.5" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">React + Vite SPA</text><text x="1118.0" y="186.5" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">ldt.zbarchibald.com</text><text x="1118.0" y="204.5" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">API URL baked in at build</text><text x="1118.0" y="222.5" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">(VITE_API_BASE_URL)</text><path d="M866,187 L949,187" fill="none" stroke="#888" stroke-width="2" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#ah-dash)"/><rect x="1552" y="79" width="308" height="154" rx="10" fill="#fff" stroke="#bbb" stroke-width="1.5"/><text x="1573" y="115" font-size="17" font-weight="bold" fill="#111" text-anchor="start">Legend</text><path d="M1573,141 L1628,141" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1643" y="150" font-size="15" font-weight="normal" fill="#333" text-anchor="start">runtime request / data</text><path d="M1573,175 L1628,175" fill="none" stroke="#888" stroke-width="2" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#ah-dash)"/><text x="1643" y="184" font-size="15" font-weight="normal" fill="#333" text-anchor="start">build, deploy, trigger</text><text x="1573" y="215" font-size="15" font-weight="normal" fill="#333" text-anchor="start">Color = provider</text><rect x="54" y="387" width="280" height="182" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="194.0" y="448.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Player&#x27;s browser</text><text x="194.0" y="468.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">runs the draft UI;</text><text x="194.0" y="486.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">champion icons load directly</text><text x="194.0" y="504.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">from the Data Dragon CDN</text><text x="194.0" y="522.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">(sprite_url in /api/champions)</text><path d="M193,387 L193,316 L1117,316 L1117,249" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="503" y="301" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">loads the app</text><rect x="530" y="359" width="868" height="350" rx="10" fill="#edf3fd" stroke="#1a5fd0" stroke-width="1.5"/><text x="546" y="390" font-size="18" font-weight="bold" fill="#1a5fd0" text-anchor="start">Google Cloud (us-central1)</text><rect x="558" y="408" width="420" height="140" rx="10" fill="#ffffff" stroke="#1a5fd0" stroke-width="1.5"/><text x="768.0" y="457.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Cloud Run: lol-draft-api</text><text x="768.0" y="477.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">FastAPI, public (no auth), CORS allowlist</text><text x="768.0" y="495.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">max 1 instance, scales to zero</text><text x="768.0" y="513.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">30 s timeout, $1 spend cap</text><rect x="558" y="597" width="420" height="84" rx="10" fill="#ffffff" stroke="#1a5fd0" stroke-width="1.5"/><text x="768.0" y="636.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Cloud Build → Artifact Registry</text><text x="768.0" y="656.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">builds the backend-only Docker image</text><rect x="1034" y="590" width="336" height="91" rx="10" fill="#ffffff" stroke="#1a5fd0" stroke-width="1.5"/><text x="1202.0" y="632.5" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Secret Manager</text><text x="1202.0" y="652.5" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">secret database-url</text><path d="M334,477 L556,477" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="446" y="445" font-size="14.5" font-weight="normal" fill="#444" text-anchor="middle">GET /api/champions</text><text x="446" y="463" font-size="14.5" font-weight="normal" fill="#444" text-anchor="middle">POST /api/recommend</text><path d="M768,597 L768,550" fill="none" stroke="#888" stroke-width="2" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#ah-dash)"/><text x="781" y="575" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">new revision</text><path d="M1201,590 L1201,520 L980,520" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1215" y="528" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">DATABASE_URL</text><path d="M1552,394 L1552,562 A154.0,14 0 0 0 1860,562 L1860,394 A154.0,14 0 0 0 1552,394 Z" fill="#e8f8ef" stroke="#0a8a55" stroke-width="1.5"/><path d="M1552,394 A154.0,14 0 0 0 1860,394" fill="none" stroke="#0a8a55" stroke-width="1.5"/><text x="1706.0" y="454.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Neon Postgres</text><text x="1706.0" y="474.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">metadata, champions,</text><text x="1706.0" y="492.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">ladder_players, matches,</text><text x="1706.0" y="510.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">champion_role_stats,</text><text x="1706.0" y="528.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">champion_relationships</text><path d="M978,477 L1550,477" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1179" y="463" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">SQL over a psycopg pool</text><path d="M1398,935 L1481,935 L1481,533 L1550,533" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1495" y="735" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">SQL reads,</text><text x="1495" y="755" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">batched writes</text><rect x="54" y="779" width="1372" height="378" rx="10" fill="#f7f8fa" stroke="#555" stroke-width="1.5"/><text x="70" y="810" font-size="18" font-weight="bold" fill="#222" text-anchor="start">GitHub: ZBArchibald/lol_draft_tool</text><rect x="586" y="814" width="364" height="84" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="768.0" y="844.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">deploy.yml</text><text x="768.0" y="864.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">push to main touching backend/,</text><text x="768.0" y="882.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">Dockerfile, pyproject.toml, …</text><path d="M768,814 L768,683" fill="none" stroke="#888" stroke-width="2" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#ah-dash)"/><text x="781" y="741" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">gcloud run deploy --source</text><text x="781" y="760" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">(Workload Identity auth)</text><rect x="82" y="905" width="266" height="126" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="215.0" y="965.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">main branch</text><text x="215.0" y="985.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">backend/ and client/</text><path d="M215,905 L215,855 L584,855" fill="none" stroke="#888" stroke-width="2" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#ah-dash)"/><text x="406" y="841" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">push to main</text><path d="M82,967 L25,967 L25,186 L557,186" fill="none" stroke="#888" stroke-width="2" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#ah-dash)"/><text x="343" y="171" font-size="14.5" font-weight="normal" fill="#444" text-anchor="start">push to main</text><rect x="586" y="926" width="364" height="90" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="768.0" y="959.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">daily-maintenance.yml</text><text x="768.0" y="979.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">cron 10:10 UTC: ldt daily-maintenance,</text><text x="768.0" y="997.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">then ldt update-ladder</text><rect x="586" y="1038" width="364" height="90" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="768.0" y="1071.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">match-sync.yml</text><text x="768.0" y="1091.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">cron 10:15 + 22:15 UTC:</text><text x="768.0" y="1109.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">ldt run-match-sync</text><rect x="1006" y="926" width="392" height="202" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="1202.0" y="997.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">ubuntu-latest runner</text><text x="1202.0" y="1017.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">uv run ldt &lt;command&gt;</text><text x="1202.0" y="1035.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">secrets: RIOT_API_KEY, DATABASE_URL</text><text x="1202.0" y="1053.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">shared concurrency group ldt-db,</text><text x="1202.0" y="1071.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">so the two jobs never overlap</text><path d="M950,970 L1004,970" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M950,1082 L1004,1082" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="1552" y="922" width="308" height="98" rx="10" fill="#fdeaea" stroke="#d02020" stroke-width="1.5"/><text x="1706.0" y="959.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Riot API</text><text x="1706.0" y="979.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">LEAGUE-V4, MATCH-V5</text><text x="1706.0" y="997.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">API key, rate-limited client</text><rect x="1552" y="1048" width="308" height="98" rx="10" fill="#fdeaea" stroke="#d02020" stroke-width="1.5"/><text x="1706.0" y="1085.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Data Dragon CDN</text><text x="1706.0" y="1105.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">versions.json, champion.json,</text><text x="1706.0" y="1123.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">champion icons (no key)</text><path d="M1398,970 L1550,970" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1398,1096 L1550,1096" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="54" y="1199" width="1806" height="161" rx="10" fill="#f7f8fa" stroke="#888" stroke-width="1.5"/><text x="70" y="1230" font-size="18" font-weight="bold" fill="#777" text-anchor="start">Local development (same code, run on your machine)</text><rect x="82" y="1251" width="280" height="84" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="222.0" y="1290.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Browser</text><text x="222.0" y="1310.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">localhost:5173</text><rect x="474" y="1251" width="364" height="84" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="656.0" y="1290.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">Vite dev server</text><text x="656.0" y="1310.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">npm run dev; proxies /api → :8000</text><rect x="950" y="1251" width="420" height="84" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="1160.0" y="1281.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">backend/ on your machine</text><text x="1160.0" y="1301.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">fastapi dev backend/main.py (:8000)</text><text x="1160.0" y="1319.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">plus ldt commands run by hand</text><rect x="1482" y="1251" width="350" height="84" rx="10" fill="#ffffff" stroke="#222222" stroke-width="1.5"/><text x="1657.0" y="1290.0" font-size="19" font-weight="bold" fill="#111" text-anchor="middle">.env in repo root</text><text x="1657.0" y="1310.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">DATABASE_URL (Neon), RIOT_API_KEY</text><path d="M362,1293 L472,1293" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M838,1293 L948,1293" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M1370,1293 L1480,1293" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah)"/><text x="1426" y="1278" font-size="14.5" font-weight="normal" fill="#444" text-anchor="middle">reads</text></svg>
