name: deploy-cloud-run

# Push-to-deploy for the FastAPI API. Authenticates to GCP via Workload
# Identity Federation (no stored service-account key) and deploys from source
# with the same `gcloud run deploy` invocation documented in CLAUDE.md.
on:
  push:
    branches: [main]
    # Only redeploy when something in the image or its build inputs changes.
    paths:
      - "backend/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required: lets the job mint the OIDC token WIF consumes
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/207927344427/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@lol-draft-tool-508418.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy lol-draft-api \
            --source . \
            --project lol-draft-tool-508418 \
            --region us-central1 \
            --allow-unauthenticated \
            --max-instances 3 \
            --set-secrets "DATABASE_URL=database-url:latest" \
            --quiet
