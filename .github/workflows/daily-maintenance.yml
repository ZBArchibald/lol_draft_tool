name: Daily Maintenance

on:
  schedule:
    # 10:10 UTC = 3:10 AM PDT (drifts to 2:10 AM during PST, since cron is fixed UTC)
    - cron: "10 10 * * *"
  workflow_dispatch:

concurrency:
  group: ldt-db
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run daily maintenance
        run: uv run ldt-daily-maintenance

      - name: Update challenger ladder
        run: uv run ldt-update-challengers
