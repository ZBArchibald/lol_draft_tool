name: Match Sync

on:
  schedule:
    # 10:15 and 22:15 UTC: 5 minutes after daily-maintenance's 10:10 UTC trigger
    # (it finishes in ~20s), then every 12h from there
    - cron: "15 10,22 * * *"
  workflow_dispatch:

concurrency:
  group: ldt-db
  cancel-in-progress: false

jobs:
  match-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run match sync
        run: uv run ldt-run-match-sync
